name: Toybox edition

on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tests/**', 'data-src/**', 'mobile/**', 'capacitor.config.ts', 'package*.json', 'vite.config.ts', 'vitest.config.ts', 'tsconfig.json', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['src/**', 'scripts/**', 'tests/**', 'data-src/**', 'mobile/**', 'capacitor.config.ts', 'package*.json', 'vite.config.ts', 'vitest.config.ts', 'tsconfig.json', '.github/workflows/mobile.yml']

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check mobile cloud tooling
        run: python3 -m unittest discover -s mobile/ci -p 'test_browserstack_*.py'
      - run: npm run build:toybox
      - run: npm run toybox:check
      - uses: actions/upload-artifact@v4
        with:
          name: dist-toybox
          path: dist-toybox
          retention-days: 7

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: bundle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run mobile:sync
      - run: cd mobile/android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: poleline-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    name: iOS simulator build
    runs-on: macos-15
    needs: bundle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync
      - run: cd mobile/ios/App && xcodebuild -project App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build -quiet
