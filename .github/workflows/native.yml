name: Native mobile
on:
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native/shared -B native/build -DCMAKE_BUILD_TYPE=Release && cmake --build native/build && ctest --test-dir native/build --output-on-failure
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash ./gradlew assembleRelease bundleRelease lintRelease --console=plain
        working-directory: native/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: |
            native/android/app/build/outputs/apk/release/*.apk
            native/android/app/build/outputs/bundle/release/*.aab
            native/android/app/build/reports/lint-results-release.*
  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: native/ios
      - name: Test native iOS app
        working-directory: native/ios
        run: |
          set -euo pipefail
          xcodebuild -version
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcodebuild test -project PoleLine.xcodeproj -scheme PoleLine -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build -resultBundlePath build/NativeTests.xcresult -test-timeouts-enabled YES -default-test-execution-time-allowance 360 -maximum-test-execution-time-allowance 600 CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool export attachments --path build/NativeTests.xcresult --output-path build/screenshots
      - name: Verify iPad layout and capture store screenshot
        working-directory: native/ios
        run: |
          set -euo pipefail
          IPAD=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPad" in x["name"] and "13" in x["name"]))')
          xcodebuild test -project PoleLine.xcodeproj -scheme PoleLine -destination "platform=iOS Simulator,id=$IPAD" -only-testing:PoleLineUITests/LaunchTests/testFirstLaunchAndNativeCircuit -derivedDataPath build -resultBundlePath build/iPadTests.xcresult -test-timeouts-enabled YES -default-test-execution-time-allowance 360 CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool export attachments --path build/iPadTests.xcresult --output-path build/screenshots-ipad
      - name: Archive device app without distribution signing
        working-directory: native/ios
        run: |
          set -euo pipefail
          xcodebuild archive -project PoleLine.xcodeproj -scheme PoleLine -configuration Release -destination 'generic/platform=iOS' -archivePath build/PoleLine.xcarchive CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-verification
          path: |
            native/ios/build/NativeTests.xcresult
            native/ios/build/iPadTests.xcresult
            native/ios/build/Build/Products/Debug-iphonesimulator/PoleLine.app
            native/ios/build/screenshots
            native/ios/build/screenshots-ipad
            native/ios/build/PoleLine.xcarchive
